---
- name: Install QEMU on Ubuntu
  hosts: all
  become: yes
  become_user: root
  tasks:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install QEMU core packages
      ansible.builtin.package:
        name:
          - qemu-system
          - qemu-system-gui # Optional, for graphical interface
          - qemu-utils
        state: present

    # --- Optional: For QEMU Guest Agent ---
    - name: Install QEMU Guest Agent
      ansible.builtin.package:
        name: qemu-guest-agent
        state: present

    - name: Enable and start qemu-guest-agent service
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started

    # --- Optional: For QEMU/KVM with Virt-Manager ---
    - name: Install QEMU/KVM and Virt-Manager
      ansible.builtin.package:
        name:
          - qemu-kvm
          - libvirt-daemon-system
          - virt-manager
        state: present

    - name: Enable and start libvirtd service
      ansible.builtin.systemd:
        name: libvirtd
        enabled: yes
        state: started

    # Note: Adding user to the 'libvirt' or 'kvm' group may be necessary
    # for non-root user management and requires a reboot or re-login.
    # This is better handled in a separate task or manual step.
